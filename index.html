<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M3U8 JSON Parser</title>
    <script src="https://cdn.jsdelivr.net/npm/m3u8-parser@4.6.0/dist/m3u8-parser.min.js"></script>
</head>
<body>
    <h2>M3U8 JSON Parser</h2>
    <input type="text" id="m3u8Url" placeholder="Enter M3U8 URL">
    <button onclick="fetchAndParseM3U8()">Fetch & Parse</button>
    <h3>Parsed JSON Output:</h3>
    <pre id="jsonOutput"></pre>

    <script>
        function getBaseUrl(url) {
            try {
                const urlObj = new URL(url);
                return urlObj.origin + urlObj.pathname.substring(0, urlObj.pathname.lastIndexOf('/') + 1);
            } catch (error) {
                console.error("Invalid URL:", error);
                return "";
            }
        }

        function getAbsoluteUrl(baseUrl, uri) {
            if (!uri) return "N/A";
            return uri.startsWith("http") ? uri : baseUrl + uri;
        }

        function getQueryParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        function fixMediaGroupUris(mediaGroups, baseUrl) {
            for (const type in mediaGroups) {
                for (const group in mediaGroups[type]) {
                    for (const item in mediaGroups[type][group]) {
                        if (mediaGroups[type][group][item].uri) {
                            mediaGroups[type][group][item].uri = getAbsoluteUrl(baseUrl, mediaGroups[type][group][item].uri);
                        }
                    }
                }
            }
            return mediaGroups;
        }

        async function fetchAndParseM3U8() {
            const url = getQueryParam('q') || document.getElementById('m3u8Url').value;
            const baseUrl = getBaseUrl(url);
            const jsonOutput = document.getElementById('jsonOutput');
            jsonOutput.textContent = '';

            if (!url) {
                alert("Please enter a valid M3U8 URL.");
                return;
            }

            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`Failed to fetch M3U8 file. Status: ${response.status}`);
                }

                const content = await response.text();
                const parser = new window.m3u8Parser.Parser();
                parser.push(content);
                parser.end();

                let parsedData = {
                    success: true,
                    parsedData: {
                        allowCache: parser.manifest.allowCache || false,
                        discontinuityStarts: parser.manifest.discontinuityStarts || [],
                        version: parser.manifest.version || null,
                        playlists: [],
                        mediaGroups: {},
                        segments: []
                    }
                };

                // Fix Playlists URIs
                if (parser.manifest.playlists) {
                    parsedData.parsedData.playlists = parser.manifest.playlists.map(variant => ({
                        attributes: variant.attributes,
                        uri: getAbsoluteUrl(baseUrl, variant.uri),
                        timeline: variant.timeline || 0
                    }));
                }

                // Fix Segments URIs
                if (parser.manifest.segments) {
                    parsedData.parsedData.segments = parser.manifest.segments.map(segment => ({
                        uri: getAbsoluteUrl(baseUrl, segment.uri),
                        duration: segment.duration || 0
                    }));
                }

                // Fix Media Group URIs
                parsedData.parsedData.mediaGroups = fixMediaGroupUris(parser.manifest.mediaGroups, baseUrl);

                // Convert JSON to a string
                const jsonString = JSON.stringify(parsedData, null, 4);

                // Check if the request is from a script (like `curl`)
                if (window.navigator.userAgent.includes("curl") || getQueryParam("download") === "1") {
                    const blob = new Blob([jsonString], { type: "application/json" });
                    const a = document.createElement("a");
                    a.href = URL.createObjectURL(blob);
                    a.download = "parsed_m3u8.json";
                    a.click();
                } else {
                    jsonOutput.textContent = jsonString;
                    console.log(parsedData);
                }

            } catch (error) {
                const errorJson = JSON.stringify({ success: false, error: error.message }, null, 4);
                jsonOutput.textContent = errorJson;
                console.error("Error:", error);
            }
        }

        window.onload = function () {
            if (getQueryParam('q')) {
                fetchAndParseM3U8();
            }
        };
    </script>
</body>
</html>
